" stroke="#38bdf8" stroke-width="1" rx="15"/><text x="0" y="-100" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="2">APPLICATION LIFECYCLE ECOSYSTEM</text><text x="0" y="-35" fill="url(#accentGrad)" filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.9))" font-size="38" font-weight="800" letter-spacing="-.5">Awesome Application Packaging</text><text x="0" y="15" fill="#f8fafc" filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.9))" font-size="34" font-weight="800" letter-spacing="-.5">&amp; Distribution</text><text x="0" y="60" fill="#94a3b8" font-size="15" font-weight="400" letter-spacing=".3">Curated Multi-Platform Packaging, Universal Formats, Build Systems &amp; Hosted Distribution Hubs</text><g fill="#cbd5e1" font-size="11" font-weight="600" transform="translate(0, 95)"><rect width="95" height="26" x="-240" y="-14" fill="#1e293b" stroke="#475569" stroke-width="1" rx="13"/><text x="-192" y="3" text-anchor="middle">⚡ Flatpak &amp; Snap</text><rect width="85" height="26" x="-135" y="-14" fill="#1e293b" stroke="#475569" stroke-width="1" rx="13"/><text x="-92" y="3" text-anchor="middle">📦 AppImage</text><rect width="80" height="26" x="-40" y="-14" fill="#1e293b" stroke="#475569" stroke-width="1" rx="13"/><text x="0" y="3" text-anchor="middle">🐧 DEB &amp; RPM</text><rect width="85" height="26" x="50" y="-14" fill="#1e293b" stroke="#475569" stroke-width="1" rx="13"/><text x="92" y="3" text-anchor="middle">❄️ Nix &amp; Guix</text><rect width="95" height="26" x="145" y="-14" fill="#1e293b" stroke="#475569" stroke-width="1" rx="13"/><text x="192" y="3" text-anchor="middle">🐳 Containers</text></g></g></svg>