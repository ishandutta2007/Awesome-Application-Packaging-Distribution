<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#090d16;border-radius:16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden"><defs><linearGradient id="bgGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#090d16"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="boxGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="100%" stop-color="#818cf8" stop-opacity=".05"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#475569" fill-opacity=".4"/></pattern></defs><style>@keyframes pulseNode{0%{transform:scale(1);opacity:.8}50%{transform:scale(1.15);opacity:1;filter:drop-shadow(0 0 10px #38bdf8)}}@keyframes orbitFlow{0%{stroke-dashoffset:200}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes waveGlow{0%{transform:translateX(-100px);opacity:.2}50%{transform:translateX(100px);opacity:.5}}.flow-line{stroke-dasharray:8 6;animation:orbitFlow 12s linear infinite}.pill-1{animation:floatPill 5s ease-in-out infinite}.pill-2{animation:floatPill 6s ease-in-out 1s infinite}.pill-3{animation:floatPill 5.5s ease-in-out 2s infinite}.glow-sphere{animation:waveGlow 8s ease-in-out infinite}</style><rect width="1200" height="360" fill="url(