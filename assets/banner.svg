<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="boxGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filter for Glow effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    /* Dynamic pulsing and floating animations */
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 10px #38bdf8); }
    }
    @keyframes orbitFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes waveGlow {
      0% { transform: translateX(-100px); opacity: 0.2; }
      50% { transform: translateX(100px); opacity: 0.5; }
      100% { transform: translateX(-100px); opacity: 0.2; }
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: orbitFlow 12s linear infinite;
    }
    .pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-2 { animation: floatPill 6s ease-in-out 1s infinite; }
    .pill-3 { animation: floatPill 5.5s ease-in-out 2s infinite; }
    .glow-sphere { animation: waveGlow 8s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Ambient Lighting Blobs in the Background (Behind all text) -->
  <g class="glow-sphere" filter="url(#glow)">
    <circle cx="200" cy="180" r="140" fill="#0284c7" opacity="0.15" />
    <circle cx="1000" cy="180" r="160" fill="#7c3aed" opacity="0.15" />
    <circle cx="600" cy="280" r="110" fill="#059669" opacity="0.12" />
  </g>

  <!-- Dynamic Circuit / Pipeline Network in Background -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" opacity="0.45">
    <path class="flow-line" stroke="#38bdf8" d="M 120 180 Q 300 80 600 90 T 1080 180" />
    <path class="flow-line" stroke="#818cf8" d="M 150 270 Q 400 320 600 270 T 1050 240" />
    <path class="flow-line" stroke="#c084fc" d="M 100 90 Q 350 30 600 60 T 1100 120" />
  </g>

  <!-- Left Animated Packaging Pod (AppImage / DEB / Flatpak) -->
  <g class="pill-1" transform="translate(80, 110)">
    <rect width="160" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.85"/>
    <circle cx="25" cy="21" r="9" fill="#0284c7" />
    <text x="44" y="26" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">📦 Universal PKG</text>
  </g>
  <g class="pill-2" transform="translate(100, 210)">
    <rect width="150" height="42" rx="21" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.85"/>
    <circle cx="25" cy="21" r="9" fill="#6366f1" />
    <text x="44" y="26" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">🚀 CI/CD Delivery</text>
  </g>

  <!-- Right Animated Distribution Pod (Containers / Repos) -->
  <g class="pill-3" transform="translate(960, 110)">
    <rect width="160" height="42" rx="21" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.85"/>
    <circle cx="25" cy="21" r="9" fill="#a855f7" />
    <text x="44" y="26" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">🛡️ Zero Trust Hub</text>
  </g>
  <g class="pill-1" transform="translate(940, 210)">
    <rect width="170" height="42" rx="21" fill="#1e293b" stroke="#34d399" stroke-width="1.2" opacity="0.85"/>
    <circle cx="25" cy="21" r="9" fill="#10b981" />
    <text x="44" y="26" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">🌐 Multi-Arch Distro</text>
  </g>

  <!-- Center Foreground Title Card -->
  <g transform="translate(600, 175)" text-anchor="middle">
    <!-- Top Category Pill -->
    <rect x="-140" y="-120" width="280" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="0" y="-100" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="2">APPLICATION LIFECYCLE ECOSYSTEM</text>

    <!-- Main Title (Strictly Foreground with drop-shadow) -->
    <text x="0" y="-35" fill="url(#accentGrad)" font-size="38" font-weight="800" letter-spacing="-0.5" filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.9))">
      Awesome Application Packaging
    </text>
    <text x="0" y="15" fill="#f8fafc" font-size="34" font-weight="800" letter-spacing="-0.5" filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.9))">
      &amp; Distribution
    </text>

    <!-- Subtitle (Clean & Legible) -->
    <text x="0" y="60" fill="#94a3b8" font-size="15" font-weight="400" letter-spacing="0.3">
      Curated Multi-Platform Packaging, Universal Formats, Build Systems &amp; Hosted Distribution Hubs
    </text>

    <!-- Bottom Feature Pills -->
    <g transform="translate(0, 95)" font-size="11" font-weight="600" fill="#cbd5e1">
      <rect x="-240" y="-14" width="95" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="-192" y="3" text-anchor="middle">⚡ Flatpak &amp; Snap</text>

      <rect x="-135" y="-14" width="85" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="-92" y="3" text-anchor="middle">📦 AppImage</text>

      <rect x="-40" y="-14" width="80" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="0" y="3" text-anchor="middle">🐧 DEB &amp; RPM</text>

      <rect x="50" y="-14" width="85" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="92" y="3" text-anchor="middle">❄️ Nix &amp; Guix</text>

      <rect x="145" y="-14" width="95" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="192" y="3" text-anchor="middle">🐳 Containers</text>
    </g>
  </g>
</svg>
